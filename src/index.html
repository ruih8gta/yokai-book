<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>妖怪図鑑 — 百鬼夜行</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Sawarabi+Mincho&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 背景の霧・人魂レイヤー -->
    <div class="bg-fx" aria-hidden="true">
        <div class="fog fog-1"></div>
        <div class="fog fog-2"></div>
        <div id="hitodama-layer"></div>
    </div>

    <header class="site-header">
        <a href="index.html" class="brand">妖怪図鑑</a>
        <nav>
            <a href="map.html" class="nav-link"><span class="nav-mark">⛩</span> 妖怪マップ</a>
        </nav>
    </header>

    <!-- ヒーロー -->
    <section class="hero">
        <div class="hero-flow" aria-hidden="true"><div class="hero-flow-track"></div></div>
        <p class="hero-kicker">日 本 全 国 ・ 妖 怪 名 鑑</p>
        <h1 class="hero-title" aria-label="百鬼夜行">
            <span>百</span><span class="accent">鬼</span><span>夜</span><span class="accent">行</span>
        </h1>
        <p class="hero-sub">闇に潜むものたちの記録を、ひもとく。</p>
        <a href="#zukan" class="hero-cta">図鑑をめくる ↓</a>
    </section>

    <main id="zukan">
        <!-- 操作バー -->
        <div class="controls">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="妖怪を探す（名前・特徴）" autocomplete="off">
            </div>
            <div id="region-filters" class="region-filters">
                <!-- 地方フィルターをJSで生成 -->
            </div>
            <p id="result-count" class="result-count"></p>
        </div>

        <div id="yokai-list-container" class="yokai-list">
            <!-- 妖怪カードをJSで生成 -->
        </div>
        <p id="empty-state" class="empty-state hidden">該当する妖怪は見つかりませんでした。</p>
    </main>

    <!-- 詳細モーダル -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal" role="dialog" aria-modal="true">
            <button class="modal-close" id="modal-close" aria-label="閉じる">✕</button>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 妖怪図鑑 — 百鬼夜行</p>
    </footer>

    <script src="script.js"></script>
    <script>
    /* ヒーロー背景：妖怪画像をランダムな順で1列に薄く流す */
    (function () {
        var images = [
            "img/akashita.png","img/amamehagi.png","img/bakeneko.png","img/chochin-kozo.png",
            "img/daidarabotchi.png","img/danzaburou-danuki.png","img/futakuchi-onna.png","img/gagoze.png",
            "img/hitotsume-kozo.png","img/hyosube.png","img/ikuchi.png","img/iso-onna.png","img/isonade.png",
            "img/ittan-momen.png","img/kani-bozu.png","img/kijimuna.png","img/koropokkuru.png",
            "img/kyubi-no-kitsune.png","img/maikubi.png","img/miminashi-hoichi.png","img/namahage.png",
            "img/nanahiro-onna.png","img/ningyoshin.png","img/nurarihyon.png","img/nurikabe.png",
            "img/omukade.png","img/osakabehime.png","img/osan-hime.png","img/otora-gitsune.png",
            "img/rokurokubi.png","img/ryomen-sukuna.png","img/shichinin-misaki.png","img/shunobon.png",
            "img/shuten-doji.png","img/suzuka-gozen.png","img/tearai-oni.png","img/tengu.png",
            "img/ura-no-oni.png","img/ushi-oni.png","img/yadokai.png","img/yagyo-san.png","img/yamabiko.png",
            "img/yamata-no-orochi.png","img/yao-bikuni.png","img/yatagarasu.png","img/yatonokami.png",
            "img/yuki-onna.png","img/zashiki-warashi.png",
            "img/nara/miwa-orochi.png","img/shimane/yomotsu.png","img/ehime/happyaku.png",
            "img/akita/hachiro.png","img/kagawa/tasaburo.png","img/nagano/momiji.png","img/miyazaki/kihachi.png",
            "img/hokkaido/mintuchi.png","img/hokkaido/nitne.png","img/okinawa/akamata.png","img/aomori/onigami.png",
            "img/aomori/osorezan.png","img/oita/beppu-oni.png","img/kumamoto/aso-ryu.png",
            "img/yamaguchi/iwakuni-hebi.png","img/yamaguchi/heike.png","img/miyagi/akuro.png",
            "img/kochi/tosa-orochi.png","img/toyama/tateyama-oni.png","img/wakayama/kiyohime.png",
            "img/fukushima/adachigahara.png","img/tokushima/kincho.png","img/kyoto/nue.png",
            "img/tochigi/yamauba.png"
        ];
        var track = document.querySelector('.hero-flow-track');
        if (track) {
            for (var i = images.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var t = images[i]; images[i] = images[j]; images[j] = t;
            }
            var seq = images.concat(images);
            track.innerHTML = seq.map(function (s) {
                return '<img src="' + s + '" alt="" loading="lazy">';
            }).join('');
        }
    })();
    </script>
</body>
</html>
